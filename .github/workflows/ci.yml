name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx commitlint --last --verbose
          fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in bridge/*.js bin/*.mjs install.mjs uninstall.mjs scripts/postinstall.mjs; do node --check "$f"; done
      - run: npm test
      - name: CLI smoke test
        run: |
          node bin/cli.mjs help
          node bin/cli.mjs status
      - name: Package contents
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          if grep -Eq "credentials\.json|\.har|sdk/|\.pyc|tests/|assets/" pack.txt; then
            echo "::error::package would ship files it shouldn't"; exit 1
          fi
